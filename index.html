    /* Custom subtle scrollbars */

    .thin-scrollbar::-webkit-scrollbar {

    }
    .thin-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    /* Smooth animations */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.5; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.45); opacity: 0; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .animate-slide-up {
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-in {
      animation: fadeIn 0.22s ease-out forwards;
    }
    .pin-pulse::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      background: currentColor;
      animation: pulseRing 1.8s infinite;
      z-index: -1;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'ai'
        ? 'bg-indigo-600 text-white'
        : type === 'warn'
        ? 'bg-amber-500 text-white'
        : 'bg-slate-900 text-white';
      toast.className = `${bg} px-4 py-2.5 rounded-2xl shadow-lg text-xs font-semibold flex items-center gap-2 animate-fade-in max-w-[92%] text-center`;
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2500);
    }

    async function runAiAnalysis() {
      const text = (state.aiAddInputText || '').trim();
      if (!text) {
        // Default to Sushi Dai demo if user clicks analyze immediately
        state.aiAddInputText = AI_PRESETS.sushi.rawInput;
      }
      const query = state.aiAddInputText.trim();
      state.aiIsAnalyzing = true;
      render();

      // Check if matches one of our rich demo presets first for instant reliable UX
      const lower = query.toLowerCase();
      if (lower.includes('sushi dai') || lower.includes('壽司大') || lower.includes('tabelog')) {
        setTimeout(() => {
          state.aiIsAnalyzing = false;
          loadPresetAiAnalysis('sushi');
          render();
        }, 700);
        return;
      }
      if (lower.includes('teamlab')) {
        setTimeout(() => {
          state.aiIsAnalyzing = false;
          loadPresetAiAnalysis('teamlab');
          render();
        }, 700);
        return;
      }
      if (lower.includes('富士山') || lower.includes('fuji')) {
        setTimeout(() => {
          state.aiIsAnalyzing = false;
          loadPresetAiAnalysis('fuji');
          render();
        }, 700);
        return;
      }

      // Attempt Gemini API structured extraction for custom user text/links, with graceful fallback
      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{
            parts: [{
              text: `Analyze this travel idea/link for a Hong Kong group trip to Tokyo and return structured JSON in natural Hong Kong Cantonese: "${query}"`
            }]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                title: { type: "STRING" },
                category: { type: "STRING", enum: ["住宿", "餐飲", "活動", "交通", "其他"] },
                subCategory: { type: "STRING" },
                location: { type: "STRING" },
                area: { type: "STRING" },
                hasLocation: { type: "BOOLEAN" },
                priceText: { type: "STRING" },
                hours: { type: "STRING" },
                rating: { type: "NUMBER" },
                aiSummary: { type: "STRING" },
                pros: { type: "ARRAY", items: { type: "STRING" } },
                cons: { type: "ARRAY", items: { type: "STRING" } }
              },
              required: ["title", "category", "subCategory", "location", "area", "hasLocation", "priceText", "hours", "rating", "aiSummary", "pros", "cons"]
            }
          }
        };

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const result = await response.json();
          const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawJson) {
            const parsed = JSON.parse(rawJson);
            const iconMap = { '住宿': '🏨', '餐飲': '🍣', '活動': '🎡', '交通': '🚆', '其他': '💡' };
            state.aiAnalysisDraft = {
              rawInput: query,
              title: parsed.title,
              category: parsed.category,
              subCategory: parsed.subCategory,
              icon: iconMap[parsed.category] || '💡',
              gradient: 'from-indigo-500 to-rose-500',
              location: parsed.location,
              area: parsed.area || '東京',
              hasLocation: parsed.hasLocation,
              mapCoords: parsed.hasLocation ? { x: 45 + Math.floor(Math.random() * 20), y: 45 + Math.floor(Math.random() * 20) } : null,
              priceText: parsed.priceText,
              priceNum: 250,
              hours: parsed.hours,
              rating: parsed.rating || 4.5,
              aiSummary: parsed.aiSummary,
              pros: parsed.pros || ['符合團隊行程路線'],
              cons: parsed.cons || ['建議提早確認開放時間'],
              suggestedDay: '暫時唔安排日子'
            };
            state.aiIsAnalyzing = false;
            state.aiAddStep = 2;
            state.aiEditMode = false;
            render();
            return;
          }
        }
      } catch (err) {
        // Fallback smoothly below if offline or unauthenticated
      }

      // Smart local fallback parser for arbitrary text
      const isFood = /食|麵|壽司|燒肉|cafe|coffee|ramen|sushi|restaurant/i.test(query);
      const isHotel = /酒店|住|hotel|airbnb|民宿/i.test(query);
      const cat = isHotel ? '住宿' : isFood ? '餐飲' : '活動';
      const cleanTitle = query.replace(/https?:\/\/\S+/g, '').trim() || '東京精選好去處';
      state.aiAnalysisDraft = {
        rawInput: query,
        title: cleanTitle.slice(0, 28),
        category: cat,
        subCategory: `${cat} → AI 自動分類`,
        icon: isHotel ? '🏨' : isFood ? '🍜' : '🎡',
        gradient: 'from-rose-500 to-indigo-600',
        location: '新宿 / 澀谷區, Tokyo',
        area: '新宿',
        hasLocation: true,
        mapCoords: { x: 42, y: 48 },
        priceText: isHotel ? 'HK$800 / 人 / 晚' : '¥2,500–3,500 / 人',
        priceNum: 200,
        hours: '10:00–22:00',
        rating: 4.5,
        aiSummary: `AI 已為你整理「${cleanTitle.slice(0, 24)}」嘅重點資訊，地點就近主要鐵路站，適合加入團隊投票。`,
        pros: ['交通位置方便', '適合朋友一齊體驗'],
        cons: ['熱門時段建議預先訂位'],
        suggestedDay: '暫時唔安排日子'
      };
      state.aiIsAnalyzing = false;
      state.aiAddStep = 2;
      state.aiEditMode = false;
      render();
    }

                ${state.aiEditMode ? '✓ 鎖定資料' : '修改資料'}
              </button>
              <button onclick="confirmSaveAiIdea()" class="col-span-3 py-3.5 rounded-2xl bg-gradient-to-r from-[#FF5A5F] to-[#F97316] text-white text-xs font-extrabold shadow-float active:scale-98 transition">

              </button>
            </div>

    function updateDraftCategory(newCat) {
      const iconMap = { '餐飲': '🍣', '住宿': '🏨', '活動': '🎡', '交通': '🚆', '其他': '💡' };
      state.aiAnalysisDraft.category = newCat;
      state.aiAnalysisDraft.subCategory = `${newCat} → 已更新類別`;
      state.aiAnalysisDraft.icon = iconMap[newCat] || '💡';
      render();
    }

    function confirmSaveAiIdea() {
      const d = state.aiAnalysisDraft;
      if (!d) return;
      const newIdeaId = 'idea-' + Date.now();
      const newIdea = {
        id: newIdeaId,
        tripId: state.activeTripId,
        title: d.title,
        shortTitle: d.title.length > 18 ? d.title.slice(0, 18) + '…' : d.title,
        category: d.category,
        subCategory: d.subCategory,
        icon: d.icon,
        gradient: d.gradient,
        location: d.location,
        area: d.area || (d.hasLocation ? '東京' : '未決定地點'),
        hasLocation: d.hasLocation,
        mapCoords: d.hasLocation ? (d.mapCoords || { x: 48, y: 50 }) : null,
        priceText: d.priceText,
        priceNum: d.priceNum || 200,
        hours: d.hours,
        rating: d.rating,
        teamScore: d.rating,
        interestedCount: 1,
        totalMembers: 6,
        votedCount: 1,
        userVote: 'must',
        status: '候選中',
        recommendedBy: 'Becky',
        aiSummary: d.aiSummary,
        pros: d.pros,
        cons: d.cons,
        comments: []
      };
      state.ideas.unshift(newIdea);

      // If user chose a specific Day in "建議安排", also push to Itinerary!
      if (d.suggestedDay && d.suggestedDay.startsWith('Day ')) {
        const dayIdx = parseInt(d.suggestedDay.replace('Day ', ''), 10) - 1;
        if (state.itineraryDays[dayIdx]) {
          state.itineraryDays[dayIdx].items.push({
            id: 'it-' + Date.now(),
            time: '12:00',
            icon: d.icon,
            title: d.title,
            category: d.category,
            booked: false,
            transit: null
          });
        }
      }

      // Reset AI step for next time & navigate to Ideas pool
      state.aiAddStep = 1;
      state.aiAddInputText = '';
      state.aiAnalysisDraft = null;
      state.ideasViewMode = 'cards';
      state.ideasCategoryFilter = '全部';
      state.onlyUnlocatedFilter = false;
      navigateTab('ideas');
      showToast(`🎉 已將「${newIdea.title}」加入 Ideas！`);
    }

    // =========================================================================
    // 6. SCREEN 5 & 6: 所有 IDEAS (CARDS, MAP, CATEGORIES)
    // =========================================================================
    function getFilteredIdeas() {
      let list = [...state.ideas];
      if (state.onlyUnlocatedFilter) {
        list = list.filter(i => !i.hasLocation);
      } else if (state.ideasCategoryFilter !== '全部') {
        list = list.filter(i => i.category === state.ideasCategoryFilter);
      }

      if (state.ideasSearchQuery.trim()) {
        const q = state.ideasSearchQuery.toLowerCase();
        list = list.filter(i =>
          i.title.toLowerCase().includes(q) ||
          i.area.toLowerCase().includes(q) ||
          i.subCategory.toLowerCase().includes(q)
        );
      }

      if (state.ideasSortBy === 'popular') {
        list.sort((a, b) => b.interestedCount - a.interestedCount);
      } else if (state.ideasSortBy === 'rating') {
        list.sort((a, b) => b.teamScore - a.teamScore);
      } else if (state.ideasSortBy === 'price') {
        list.sort((a, b) => a.priceNum - b.priceNum);
      }
      return list;
    }

    function castIdeaVote(ideaId, voteKey) {
      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;
      const wasUnvoted = idea.userVote === null;
      idea.userVote = voteKey;
      if (wasUnvoted && idea.votedCount < idea.totalMembers) {
        idea.votedCount += 1;
      }
      if (voteKey === 'must' || voteKey === 'interested') {
        if (wasUnvoted && idea.interestedCount < idea.totalMembers) {
          idea.interestedCount += 1;
        }
        idea.teamScore = Math.min(5.0, +(idea.teamScore + 0.2).toFixed(1));
      } else if (voteKey === 'pass') {
        idea.teamScore = Math.max(2.5, +(idea.teamScore - 0.3).toFixed(1));
      }
      render();
      openVoteModal(ideaId);
      showToast('🗳 已記錄你嘅投票！');
    }

    function postIdeaComment(ideaId) {
      const input = document.getElementById('vote-comment-input');
      const text = (input ? input.value : '').trim();
      if (!text) return;
      const idea = state.ideas.find(i => i.id === ideaId);
      if (idea) {
        idea.comments.push({ user: 'Becky', text });
        openVoteModal(ideaId);
        showToast('💬 已新增補充意見');
      }
    }

    function confirmIdeaFromModal(ideaId) {
      const idea = state.ideas.find(i => i.id === ideaId);

    function confirmAssignDay(ideaId) {
      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;

      // Get selected day & time
      const dayRadio = document.querySelector('input[name="assign_day"]:checked');
      const dayIdx = dayRadio ? parseInt(dayRadio.value, 10) : state.activeDayIndex;
      const timeInput = document.getElementById('assign-time-input');
      const timeVal = timeInput ? timeInput.value : '12:00';

      // Mark idea as confirmed
      idea.status = '已確定';

      // Add to selected day's itinerary
      state.itineraryDays[dayIdx].items.push({
        id: 'it-' + Date.now(),
        time: timeVal,
        icon: idea.icon,
        title: idea.shortTitle,
        category: idea.category,
        booked: false,
        transit: null
      });

      // Sort chronological
      state.itineraryDays[dayIdx].items.sort((a, b) => a.time.localeCompare(b.time));

      // Switch view to the selected day
      state.activeDayIndex = dayIdx;
      closeOverlay();
      navigateTab('itinerary');
      showToast(`🗓 已將「${idea.shortTitle}」排入 ${state.itineraryDays[dayIdx].dayLabel} ${timeVal}！`);
    }

                      </span>
                    </div>

                    <div class="grid grid-cols-1 gap-2.5">
                      ${items.map(dec => `
                        <div onclick="openDecisionActionSheet('${dec.id}')" class="p-3.5 rounded-2xl border ${status === '已決定' ? 'bg-emerald-50/40 border-emerald-200/70' : 'bg-slate-50 hover:bg-rose-50/40 border-slate-200/60'} cursor-pointer transition active:scale-[0.99]">
                          <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                              <span class="text-xl">${dec.icon}</span>
                              <div>
                                <div class="text-xs font-extrabold text-slate-900">${dec.title}</div>
                                <div class="text-[11px] text-slate-500 mt-0.5">${dec.subtitle}</div>
                              </div>
                            </div>
                            <span class="text-xs font-extrabold ${status === '已決定' ? 'text-emerald-600' : 'text-[#FF5A5F]'}">
                              ${status === '已決定' ? dec.winnerLabel : `${dec.votedText} →`}
                            </span>
                          </div>
                          ${status !== '已決定' ? `
                            <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden mt-2.5">
                              <div class="h-full ${status === '投票中' ? 'bg-indigo-500' : 'bg-amber-400'} rounded-full" style="width: ${dec.progress}%"></div>
                            </div>
                          ` : ''}
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function openDecisionActionSheet(decId) {
      const dec = state.decisions.find(d => d.id === decId);
      if (!dec) return;
      const overlay = document.getElementById('overlay-layer');
      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <div class="bg-white rounded-t-3xl p-5 shadow-2xl animate-slide-up space-y-4">
          <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto"></div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="text-2xl">${dec.icon}</span>
              <div>
                <h3 class="text-base font-extrabold text-slate-900">${dec.title}</h3>
                <p class="text-xs text-slate-500">${dec.subtitle} · ${dec.votedText}</p>
              </div>
            </div>
            <button onclick="closeOverlay()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm">✕</button>
          </div>

          <div class="grid grid-cols-1 gap-2">
            ${dec.actionType.startsWith('compare') ? `
              <button onclick="closeOverlay(); state.compareCategory='${dec.actionType === 'compare-hotel' ? '住宿' : '餐飲'}'; navigateTab('compare');" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-extrabold">
                ⚖️ 進入並排比較選項
              </button>
            ` : `
              <button onclick="closeOverlay(); openVoteModal('${dec.winnerIdeaId}');" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-extrabold">
                🗳 檢視詳情及團隊投票
              </button>
            `}

            <div class="grid grid-cols-3 gap-2 pt-1">
              <button onclick="updateDecisionStatus('${dec.id}', '已決定')" class="py-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-extrabold">
                ✓ 確定
              </button>
              <button onclick="updateDecisionStatus('${dec.id}', '投票中')" class="py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-700 text-xs font-extrabold">
                🤔 考慮中
              </button>
              <button onclick="updateDecisionStatus('${dec.id}', '待討論')" class="py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-extrabold">
                ✕ 暫緩/不選
              </button>
            </div>

            <button onclick="pushDecisionToItinerary('${dec.id}')" class="w-full py-3 rounded-2xl bg-slate-900 text-white text-xs font-extrabold mt-1">
              🗓 直接排入行程 (Assign Day)
            </button>
          </div>
        </div>
      `;
    }

    function updateDecisionStatus(decId, newStatus) {
      const dec = state.decisions.find(d => d.id === decId);
      if (!dec) return;
      dec.status = newStatus;
      if (newStatus === '已決定') {
        dec.votedText = '6/6 ✓';
        dec.progress = 100;
        if (!dec.winnerLabel.startsWith('✓')) dec.winnerLabel = '✓ ' + dec.winnerLabel;
      }
      closeOverlay();
      render();
      showToast(`已更新「${dec.title}」為：${newStatus}`);
    }

    function pushDecisionToItinerary(decId) {
      const dec = state.decisions.find(d => d.id === decId);
      if (!dec || !dec.winnerIdeaId) return;
      dec.status = '已決定';
      closeOverlay();
      openAssignDayModal(dec.winnerIdeaId);
    }

    // =========================================================================
    // 10. SCREEN 10: 🗓 最終行程 (ITINERARY TIMELINE)
    // =========================================================================
    function renderScreen10Itinerary() {
      const trip = getActiveTrip();
      const day = state.itineraryDays[state.activeDayIndex] || state.itineraryDays[0];

      return `
        <div class="min-h-full bg-[#F8FAFC] pb-10 animate-fade-in">
          <!-- Header & Day Tabs -->
          <div class="bg-white px-5 pt-4 pb-3 border-b border-slate-100 sticky top-0 z-20">
            <div class="flex items-center justify-between mb-3">
              <h1 class="text-lg font-extrabold text-slate-900">${trip.flag} 東京行程</h1>
              <button onclick="openAddItineraryItemModal()" class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-extrabold transition">
                ＋ 加入已確定 Idea
              </button>
            </div>

            <!-- [DAY 1] [DAY 2] [DAY 3] [DAY 4] [＋] -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${state.itineraryDays.map((d, idx) => {
                const active = idx === state.activeDayIndex;
                return `
                  <button onclick="state.activeDayIndex=${idx}; render();" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition ${active ? 'bg-slate-900 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    ${d.dayLabel}
                  </button>
                `;
              }).join('')}
              <button onclick="addNewItineraryDay()" class="shrink-0 w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-extrabold flex items-center justify-center">
                ＋
              </button>
            </div>
          </div>

          <!-- Day Title Banner -->
          <div class="px-5 pt-4">
            <div class="bg-white rounded-2xl px-4 py-3 border border-slate-200/80 shadow-card flex items-center justify-between">
              <div>
                <div class="text-[11px] font-bold text-[#FF5A5F]">${day.dateText}</div>
                <h2 class="text-base font-extrabold text-slate-900 mt-0.5">${day.dayLabel} ｜${day.routeTitle}</h2>
              </div>
              <span class="text-xs font-bold text-slate-400">${day.items.length} 項安排</span>
            </div>
          </div>

          <!-- Vertical Timeline -->
          <div class="px-5 pt-5">
            <div class="relative pl-14 space-y-0">
              <!-- Continuous Vertical Line -->
              <div class="absolute left-[63px] top-3 bottom-6 w-0.5 bg-slate-200"></div>

              ${day.items.map((item, idx) => {
                const isFree = item.category === 'free';
                return `
                  <div class="relative pb-6">
                    <!-- Left Time Label -->
                    <div class="absolute -left-14 top-1 w-11 text-right text-xs font-extrabold text-slate-500">
                      ${item.time}
                    </div>

                    <!-- Timeline Node Dot -->
                    <div class="absolute left-[3px] top-1.5 w-3.5 h-3.5 rounded-full ${isFree ? 'bg-white border-2 border-slate-400 rotate-45 rounded-xs' : 'bg-[#FF5A5F] ring-4 ring-rose-50'} z-10"></div>

                    <!-- Timeline Event Card -->
                    <div class="ml-6 ${isFree ? 'bg-slate-100/80 border border-dashed border-slate-300' : 'bg-white border border-slate-200/80 shadow-card'} rounded-2xl p-3.5">
                      <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span class="text-base">${item.icon}</span>
                          <span class="text-xs font-extrabold ${isFree ? 'text-slate-600' : 'text-slate-900'}">${item.title}</span>
                        </div>
                        ${item.booked !== null ? `
                          <button onclick="toggleItineraryBooking(${idx})" class="shrink-0 px-2 py-0.5 rounded-lg text-[10px] font-extrabold transition ${item.booked ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                            ${item.booked ? '✓ 已訂位' : '⚠️ 未訂位'}
                          </button>
                        ` : ''}
                      </div>
                    </div>

                    <!-- Optional Transit Connector -->
                    ${item.transit ? `
                      <div class="ml-6 mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-[11px] font-bold">
                        <span>${item.transit}</span>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Bottom Add Confirmed Idea CTA -->
            <button onclick="openAddItineraryItemModal()" class="w-full mt-2 py-3 rounded-2xl border-2 border-dashed border-slate-300 hover:border-[#FF5A5F] text-slate-600 hover:text-[#FF5A5F] text-xs font-extrabold transition">
              ＋ 從已確定 / 候選 Ideas 加入 ${day.dayLabel}
            </button>
          </div>
        </div>
      `;
    }

    function toggleItineraryBooking(itemIdx) {
      const item = state.itineraryDays[state.activeDayIndex].items[itemIdx];
      if (!item || item.booked === null) return;
      item.booked = !item.booked;
      render();
      showToast(item.booked ? `✓ 已標記「${item.title}」為已訂位` : `⚠️ 已標記為未訂位`);
    }

    function addNewItineraryDay() {
      const nextNum = state.itineraryDays.length + 1;
      state.itineraryDays.push({
        dayLabel: `DAY ${nextNum}`,
        dateText: `3月${14 + nextNum}日`,
        routeTitle: '自由探索 / 購物日',
        items: [
          { id: 'it-' + Date.now(), time: '10:00', icon: '◇', title: 'Free Time (按團隊投票決定)', category: 'free', booked: null, transit: null }
        ]
      });
      state.activeDayIndex = nextNum - 1;
      render();
      showToast(`🗓 已新增 DAY ${nextNum}`);
    }

    function openAddItineraryItemModal() {
      const day = state.itineraryDays[state.activeDayIndex];
      const overlay = document.getElementById('overlay-layer');
      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <div class="bg-white rounded-t-3xl p-5 max-h-[82%] flex flex-col shadow-2xl animate-slide-up">
          <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3"></div>
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="text-base font-extrabold text-slate-900">🗓 加入到 ${day.dayLabel}</h3>
              <p class="text-xs text-slate-500">揀選已確定或高票 Ideas 自動排入行程</p>
            </div>
            <button onclick="closeOverlay()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold text-sm">✕</button>
          </div>

          <div class="mb-3 flex items-center gap-2">
            <label class="text-xs font-bold text-slate-700">安排時間：</label>
            <input id="itinerary-pick-time" type="time" value="16:30" class="px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold" />
          </div>

          <div class="overflow-y-auto thin-scrollbar space-y-2">
            ${state.ideas.map(idea => `
              <button onclick="insertPickedIdeaToDay('${idea.id}')" class="w-full p-3 rounded-2xl bg-slate-50 hover:bg-emerald-50 border border-slate-200/70 flex items-center justify-between text-left transition">
                <div class="flex items-center gap-2.5">
                  <span class="text-xl">${idea.icon}</span>
                  <div>
                    <div class="text-xs font-extrabold text-slate-900">${idea.shortTitle}</div>
                    <div class="text-[10px] text-slate-500">📍 ${idea.area} · ⭐ ${idea.teamScore.toFixed(1)}</div>
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded-xl bg-slate-900 text-white text-[11px] font-bold">＋ 加入</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function insertPickedIdeaToDay(ideaId) {
      const idea = state.ideas.find(i => i.id === ideaId);
      const timeVal = document.getElementById('itinerary-pick-time')?.value || '16:30';
      if (!idea) return;
      state.itineraryDays[state.activeDayIndex].items.push({
        id: 'it-' + Date.now(),
        time: timeVal,
        icon: idea.icon,
        title: idea.shortTitle,
        category: idea.category,
        booked: false,
        transit: null
      });
      // Sort items chronologically by time string
      state.itineraryDays[state.activeDayIndex].items.sort((a, b) => a.time.localeCompare(b.time));
      closeOverlay();
      render();
      showToast(`✓ 已加入「${idea.shortTitle}」(${timeVal})`);
    }

    // =========================================================================
    // 11. MAIN RENDER ORCHESTRATOR
    // =========================================================================
    function render() {
      const container = document.getElementById('app-screen-container');
      const bottomNav = document.getElementById('bottom-nav');

      if (state.currentScreen === 'trips') {
        bottomNav.classList.add('hidden');
        container.innerHTML = renderScreen1Trips();
        return;
      }

      // Inside a Trip -> show fixed 5-item Bottom Navigation Bar
      bottomNav.classList.remove('hidden');

      // Update active tab styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const tab = btn.getAttribute('data-tab');
        const isActive = (tab === state.activeTab) || (tab === 'ideas' && state.activeTab === 'compare');
        if (isActive) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-[#FF5A5F]');
        } else {
          btn.classList.remove('text-[#FF5A5F]');
          btn.classList.add('text-slate-400');
        }
      });

      // Update group unresolved badge
      const groupBadge = document.getElementById('nav-group-badge');
      const unresolved = getUnresolvedDecisionsCount();
      if (groupBadge) {
        if (unresolved > 0) {
          groupBadge.classList.remove('hidden');
          groupBadge.textContent = unresolved;
        } else {
          groupBadge.classList.add('hidden');
        }
      }

      // Render active screen
      switch (state.activeTab) {
        case 'home':
          container.innerHTML = renderScreen2Home();
          break;
        case 'ideas':
          container.innerHTML = renderScreen5And6Ideas();
          break;
        case 'add':
          container.innerHTML = renderScreen3And4AddIdea();
          break;
        case 'compare':
          container.innerHTML = renderScreen8Compare();
          break;
        case 'group':
          container.innerHTML = renderScreen9Group();
          break;
        case 'itinerary':
          container.innerHTML = renderScreen10Itinerary();
          break;
        default:
          container.innerHTML = renderScreen2Home();
      }
    }

    // Initialize Application on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderDemoSwitcher();
      render();
    });
  </script>
</body>
</html>
