  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbar for clean horizontal pills */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.22s ease-out forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Clean time input styling so users clearly see it's editable */
    input[type="time"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.65;
      filter: invert(35%) sepia(85%) saturate(2200%) hue-rotate(335deg) brightness(98%) contrast(95%);
    }

    /* Leaflet custom pin styling */
    .custom-map-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
      font-size: 17px;
      transition: transform 0.15s ease;
    }
    .custom-map-pin:hover {
      transform: scale(1.15);
    }
  </style>

      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-900/95 text-white';
      el.className = `${bg} px-4 py-2.5 rounded-2xl text-xs font-bold shadow-float animate-fade-in flex items-center gap-2`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {

        setTimeout(() => el.remove(), 250);
      }, 2400);

    function extractYouTubeVideoId(url) {
      if (!url) return null;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /[?&]v=([a-zA-Z0-9_-]{11})/
      ];
      for (const p of patterns) {
        const match = url.match(p);
        if (match && match[1]) return match[1];
      }
      return null;
    }

    async function fetchVideoOEmbedMetadata(url) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 2800);
        const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`, {
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.title) {
          return {
            title: data.title,
            author: data.author_name || '',
            thumbnail: data.thumbnail_url || ''
          };
        }
      } catch (e) {
        // Silently ignore oEmbed timeout/CORS and rely on Gemini Search Grounding
      }
      return null;
    }

    async function callGeminiWithSearch(promptText, systemPrompt) {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: promptText }] }],
        tools: [{ "google_search": {} }],
        systemInstruction: {
          parts: [{ text: systemPrompt }]
        }
      };

      const maxRetries = 3;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            if (attempt < maxRetries && (response.status === 429 || response.status >= 500)) {
              await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
              continue;
            }
            throw new Error(`HTTP ${response.status}`);
          }

          const result = await response.json();
          const candidate = result.candidates?.[0];
          const rawText = candidate?.content?.parts?.[0]?.text || '';
          return rawText;
        } catch (err) {
          if (attempt < maxRetries) {
            await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
            continue;
          }
          throw err;
        }
      }
      return '';
    }

    async function startAIAnalysis() {
      const inputEl = document.getElementById('ai-paste-input');
      const noteEl = document.getElementById('ai-extra-note');
      const rawText = (inputEl ? inputEl.value : state.addInputText).trim();
      const extraNote = (noteEl ? noteEl.value : state.addExtraNote).trim();

      if (!rawText && !extraNote) {
        showToast('請先貼上連結或輸入你想去嘅地方');
        return;
      }

      state.addInputText = rawText;
      state.addExtraNote = extraNote;
      state.isAnalyzing = true;
      state.isEditingAiDraft = false;
      render();

      const combinedInput = `${rawText} ${extraNote}`.trim();
      const ytVideoId = extractYouTubeVideoId(rawText);
      const isIgUrl = /instagram\.com|instagr\.am/i.test(rawText);
      const isVideoUrl = Boolean(ytVideoId) || isIgUrl || /tiktok\.com|xiaohongshu\.com|bilibili\.com|youtu/i.test(rawText);

      // 1. Fetch real oEmbed video title/channel if available (especially for YouTube)
      let oembedInfo = null;
      if (/^https?:\/\//i.test(rawText)) {
        oembedInfo = await fetchVideoOEmbedMetadata(rawText);
      }

      const realThumbnail = ytVideoId
        ? `https://i.ytimg.com/vi/${ytVideoId}/hqdefault.jpg`
        : (oembedInfo?.thumbnail || '');

      const sourceType = ytVideoId
        ? 'YouTube Video'
        : (isIgUrl ? 'IG Reel' : (isVideoUrl ? 'Video Link' : (/^https?:\/\//i.test(rawText) ? 'Web Link' : 'Quick Note')));

      const activeTrip = state.trips.find(t => t.id === state.activeTripId);
      const tripDestination = activeTrip ? activeTrip.title : '東京 2027';

      const systemPrompt = `You are the AI Travel Video & Link Analyzer for "TripTogether", a Hong Kong group travel planning app.
Your job is to analyze the user's pasted video URL (YouTube, Instagram Reel, TikTok, etc.), video title/caption, or travel note, use Google Search to look up the EXACT place/restaurant/attraction/hotel featured in that video or link, and output a single valid JSON object in natural Hong Kong Cantonese (廣東話 + 常用英文 UX 字眼).

CRITICAL RULES:
1. Do NOT invent an unrelated restaurant or attraction. Base your extraction strictly on the video title, URL keywords, caption, and Google Search findings.
2. If the user pasted an Instagram URL without any caption/keywords and Google Search cannot identify what is inside that specific Reel, set "needsManualCheck": true and ask the user in "aiSummary" to paste the IG post caption or click "修改資料".
3. Output ONLY raw JSON (no markdown code fences, no extra explanation).
4. JSON schema:
{
  "title": "Exact place/attraction/restaurant name (e.g. 銀座 篝 Kagari 本店)",
  "shortTitle": "Short name under 14 chars",
  "category": "Must be one of: 住宿, 餐飲, 活動, 交通",
  "subCategory": "Specific cuisine or activity type in Cantonese",
  "icon": "Single matching emoji (e.g. 🍜, 🍣, 🏨, ⛩️, 🎢, 🍵, 🚆)",
  "location": "Full address or specific station/area",
  "area": "District name (e.g. 銀座, 新宿, 淺草, 澀谷)",
  "hasLocation": true,
  "lat": 35.6717,
  "lng": 139.7615,
  "priceText": "Estimated cost per person (e.g. ¥1,500 / 人 or HK$850 / 晚)",
  "priceNum": 80,
  "hours": "Opening hours (e.g. 11:00–21:30)",
  "rating": 4.6,
  "isVideoParsed": ${isVideoUrl},
  "needsManualCheck": false,
  "videoInsights": [
    "📺 影片重點 1（具體菜式、打卡位或攻略貼士）",
    "💡 影片重點 2（排隊時間、預約方法或注意事項）"
  ],
  "aiSummary": "Concise 2-sentence summary in Hong Kong Cantonese tailored to the video content.",
  "pros": ["Advantage 1", "Advantage 2"],
  "cons": ["Caveat 1", "Caveat 2"]
}`;

      const userQuery = `Trip Destination: ${tripDestination}
Pasted Link / Input: ${rawText || '(None)'}
${oembedInfo ? `Fetched Video Title: "${oembedInfo.title}" by Channel "${oembedInfo.author}"` : ''}
${extraNote ? `User Provided Caption / Note: "${extraNote}"` : ''}

Please search Google for this exact video / place and return the structured JSON analysis.`;

      try {
        const rawResponse = await callGeminiWithSearch(userQuery, systemPrompt);
        const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('Invalid JSON format from AI');

        const parsed = JSON.parse(jsonMatch[0]);
        const validCategories = ['住宿', '餐飲', '活動', '交通'];
        const category = validCategories.includes(parsed.category) ? parsed.category : '活動';

        state.aiAnalysisDraft = {
          title: parsed.title || oembedInfo?.title || extraNote || rawText.slice(0, 30),
          shortTitle: parsed.shortTitle || (parsed.title || oembedInfo?.title || '新旅遊靈感').slice(0, 14),
          category: category,
          subCategory: parsed.subCategory || '特色體驗',
          icon: parsed.icon || (category === '餐飲' ? '🍴' : category === '住宿' ? '🏨' : category === '交通' ? '🚆' : '✨'),
          image: realThumbnail || getCategoryImage(category),
          sourceUrl: rawText || extraNote,
          sourceType: sourceType,
          location: parsed.location || '東京市區',
          area: parsed.area || '東京',
          hasLocation: parsed.hasLocation !== false,
          mapCoords: (typeof parsed.lat === 'number' && typeof parsed.lng === 'number')
            ? { lat: parsed.lat, lng: parsed.lng }
            : { lat: 35.6812, lng: 139.7671 },
          priceText: parsed.priceText || '價格待定',
          priceNum: typeof parsed.priceNum === 'number' ? parsed.priceNum : 100,
          hours: parsed.hours || '請查閱官網',
          rating: typeof parsed.rating === 'number' ? parsed.rating : 4.5,
          isVideoParsed: isVideoUrl,
          needsManualCheck: Boolean(parsed.needsManualCheck),
          videoInsights: Array.isArray(parsed.videoInsights) && parsed.videoInsights.length > 0
            ? parsed.videoInsights
            : (oembedInfo ? [`📺 影片標題：${oembedInfo.title}（頻道：${oembedInfo.author}）`] : []),
          aiSummary: parsed.aiSummary || 'AI 已為你整理此連結嘅重點資訊，加入後可與團隊一齊投票決定。',
          pros: Array.isArray(parsed.pros) && parsed.pros.length > 0 ? parsed.pros : ['適合團隊一齊體驗'],
          cons: Array.isArray(parsed.cons) && parsed.cons.length > 0 ? parsed.cons : ['建議出發前再確認營業時間']
        };
      } catch (error) {
        // Fallback if network/API fails so the user is never stuck
        const fallbackTitle = oembedInfo?.title || extraNote || rawText.replace(/^https?:\/\/(www\.)?/, '').slice(0, 28) || '自訂旅行靈感';
        state.aiAnalysisDraft = {
          title: fallbackTitle,
          shortTitle: fallbackTitle.slice(0, 14),
          category: '活動',
          subCategory: '影片 / 連結收藏',
          icon: '🎬',
          image: realThumbnail || IMG_SHRINE,
          sourceUrl: rawText || extraNote,
          sourceType: sourceType,
          location: '東京（可點擊修改資料補充地址）',
          area: '東京',
          hasLocation: true,
          mapCoords: { lat: 35.6812, lng: 139.7671 },
          priceText: '待確認',
          priceNum: 100,
          hours: '待確認',
          rating: 4.5,
          isVideoParsed: isVideoUrl,
          needsManualCheck: true,
          videoInsights: oembedInfo
            ? [`📺 已讀取影片標題：${oembedInfo.title}`, `👤 創作者頻道：${oembedInfo.author}`]
            : ['⚠️ 此連結暫時未能自動讀取完整字幕，建議點擊下方「✏️ 修改資料」補充地點名稱。'],
          aiSummary: `已為你保存「${fallbackTitle}」。你可以點擊「修改資料」微調地點與消費預算，再加入團隊投票池。`,
          pros: ['已保留原始影片連結與縮圖'],
          cons: ['建議手動補充具體地區與人均預算']
        };
      }

      state.isAnalyzing = false;
      state.selectedAiAssignDay = 'none';
      render();
    }

    function toggleEditAiDraft() {
      if (state.isEditingAiDraft) {
        saveAiDraftEdits();
      } else {
        state.isEditingAiDraft = true;
        render();
      }
    }

    function saveAiDraftEdits() {
      if (!state.aiAnalysisDraft) return;
      const titleVal = document.getElementById('edit-draft-title')?.value.trim();
      const catVal = document.getElementById('edit-draft-category')?.value;
      const areaVal = document.getElementById('edit-draft-area')?.value.trim();
      const priceVal = document.getElementById('edit-draft-price')?.value.trim();
      const hoursVal = document.getElementById('edit-draft-hours')?.value.trim();
      const summaryVal = document.getElementById('edit-draft-summary')?.value.trim();

      if (titleVal) {
        state.aiAnalysisDraft.title = titleVal;
        state.aiAnalysisDraft.shortTitle = titleVal.slice(0, 14);
      }
      if (catVal) state.aiAnalysisDraft.category = catVal;
      if (areaVal) {
        state.aiAnalysisDraft.area = areaVal;
        state.aiAnalysisDraft.location = areaVal;
      }
      if (priceVal) state.aiAnalysisDraft.priceText = priceVal;
      if (hoursVal) state.aiAnalysisDraft.hours = hoursVal;
      if (summaryVal) state.aiAnalysisDraft.aiSummary = summaryVal;

      state.aiAnalysisDraft.needsManualCheck = false;
      state.isEditingAiDraft = false;
      render();
      showToast('✓ 已更新分析資料');

      if (state.ideasCategoryFilter !== '全部') {
        list = list.filter(i => i.category === state.ideasCategoryFilter);
      }

      if (state.ideasSearchQuery.trim()) {
        const q = state.ideasSearchQuery.toLowerCase();
        list = list.filter(i =>
          i.title.toLowerCase().includes(q) ||
          i.area.toLowerCase().includes(q) ||
          i.category.toLowerCase().includes(q)
        );
      }

      if (state.ideasSortBy === 'hot') {
        list.sort((a, b) => b.interestedCount - a.interestedCount);
      } else if (state.ideasSortBy === 'rating') {
        list.sort((a, b) => b.teamScore - a.teamScore);
      } else if (state.ideasSortBy === 'price') {
        list.sort((a, b) => a.priceNum - b.priceNum);
      }

      return list;

    function initLeafletMap() {
      if (typeof L === 'undefined') return;
      const container = document.getElementById('leaflet-map-container');
      if (!container) return;

      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
      }

      // Center on Tokyo
      leafletMap = L.map('leaflet-map-container', {
        zoomControl: true
      }).setView([35.6762, 139.7300], 11);

      // Clean light map tiles
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
      }).addTo(leafletMap);

      const filtered = getFilteredSortedIdeas().filter(i => i.hasLocation && i.mapCoords);
      const bounds = [];

      filtered.forEach(idea => {
        let pinBg = '#10b981'; // green for activity
        if (idea.category === '住宿') pinBg = '#3b82f6'; // blue
        if (idea.category === '餐飲') pinBg = '#f97316'; // orange
        if (idea.category === '交通') pinBg = '#8b5cf6'; // purple

        const customIcon = L.divIcon({
          className: '',
          html: `<div class="custom-map-pin" style="background-color: ${pinBg};">${idea.icon}</div>`,
          iconSize: [38, 38],
          iconAnchor: [19, 19]
        });

        const marker = L.marker([idea.mapCoords.lat, idea.mapCoords.lng], { icon: customIcon }).addTo(leafletMap);
        bounds.push([idea.mapCoords.lat, idea.mapCoords.lng]);

        marker.on('click', () => {
          const bottomCard = document.getElementById('map-bottom-card');
          if (bottomCard) {
            bottomCard.innerHTML = renderMapPreviewCard(idea);
          }
          leafletMap.panTo([idea.mapCoords.lat, idea.mapCoords.lng]);
        });
      });

      if (bounds.length > 1) {
        leafletMap.fitBounds(bounds, { padding: [45, 45], maxZoom: 13 });
      }

      // Force Leaflet to recalculate container dimensions so tiles render completely
      setTimeout(() => {
        if (leafletMap) leafletMap.invalidateSize();
      }, 120);
    }

    function castVote(ideaId, voteKey) {
      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;

      const prevVote = idea.userVote;
      if (!idea.votesBreakdown) {
        idea.votesBreakdown = { must: 2, interested: 1, neutral: 1, no: 0 };
      }

      if (prevVote && idea.votesBreakdown[prevVote] > 0) {
        idea.votesBreakdown[prevVote] -= 1;
      } else if (!prevVote) {
        idea.votedCount = Math.min(idea.totalMembers, idea.votedCount + 1);
      }

      idea.userVote = voteKey;
      idea.votesBreakdown[voteKey] += 1;

      // Recalculate interested count & score
      idea.interestedCount = Math.min(idea.totalMembers, idea.votesBreakdown.must + idea.votesBreakdown.interested);
      const total = Math.max(1, idea.votesBreakdown.must + idea.votesBreakdown.interested + idea.votesBreakdown.neutral + idea.votesBreakdown.no);
      const weighted = (idea.votesBreakdown.must * 5 + idea.votesBreakdown.interested * 4.3 + idea.votesBreakdown.neutral * 3.2 + idea.votesBreakdown.no * 1.5) / total;
      idea.teamScore = Math.min(5.0, Math.max(1.0, weighted));

      render();
      openIdeaDetailModal(ideaId);
      showToast('✓ 已更新你嘅投票結果！', 'success');
    }

    function addCommentToIdea(ideaId) {
      const input = document.getElementById('detail-comment-input');
      const text = input ? input.value.trim() : '';
      if (!text) return;
      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;
      idea.comments.push({ user: 'Becky', text });
      openIdeaDetailModal(ideaId);
    }

    function copySourceLink(url) {
      const temp = document.createElement('textarea');

    function initSortable() {
      if (typeof Sortable === 'undefined') return;
      const lists = document.querySelectorAll('.itinerary-day-list');
      lists.forEach(list => {
        new Sortable(list, {
          group: 'itinerary-days',
          animation: 160,
          handle: '.drag-handle',
          filter: 'input, button',
          preventOnFilter: false,
          ghostClass: 'opacity-40',
          onEnd: function (evt) {
            const fromDayIdx = parseInt(evt.from.dataset.dayIndex, 10);
            const toDayIdx = parseInt(evt.to.dataset.dayIndex, 10);
            const oldIndex = evt.oldIndex;
            const newIndex = evt.newIndex;

            if (isNaN(fromDayIdx) || isNaN(toDayIdx)) return;
            // Adjust index if vertical line div offset affected DOM children
            const movedItem = state.itineraryDays[fromDayIdx].items.splice(oldIndex, 1)[0];
            if (movedItem) {
              state.itineraryDays[toDayIdx].items.splice(newIndex, 0, movedItem);
              render();
              showToast('✓ 行程順序已更新');
            }
          }
        });
      });
    }

          </div>

          <!-- Group Members Progress -->
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-card space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-extrabold text-slate-900">旅伴投票進度 (6 人)</h2>
              <button onclick="copyInviteLink()" class="text-xs font-extrabold text-rose-500 hover:underline">＋ 邀請朋友</button>
            </div>
            <div class="space-y-2.5">
              ${state.members.map(m => `
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr ${m.color} text-white text-xs font-extrabold flex items-center justify-center">
                      ${m.initial}
                    </div>
                    <div>
                      <p class="text-xs font-extrabold text-slate-900">${m.name}</p>
                      <p class="text-[10px] text-slate-400">${m.role}</p>
                    </div>
                  </div>
                  <span class="px-2.5 py-1 rounded-full ${m.voted === m.total ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-600'} text-[11px] font-extrabold">
                    已投 ${m.voted}/${m.total}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function markDecisionConfirmed(decId) {
      const dec = state.decisions.find(d => d.id === decId);
      if (dec) {
        dec.status = 'decided';
        dec.voted = dec.total;
        dec.optionsText = '✓ 團隊已達成共識並確認';
        render();
        showToast(`🎉 「${dec.title}」已標記為確定！`, 'success');
      }
    }

    function copyInviteLink() {
      copySourceLink('https://triptogether.app/join/tokyo-2027-becky');
      showToast('🔗 已複製群組邀請連結！');
    }

    // =========================================================================
    // 12. AI TRIP INSIGHTS MODAL (✨ AI 旅程分析)
    // =========================================================================
    function openAiInsightsModal() {
      const foodCount = state.ideas.filter(i => i.category === '餐飲').length;
      const stayCount = state.ideas.filter(i => i.category === '住宿').length;
      const actCount = state.ideas.filter(i => i.category === '活動').length;

      openModal(`
        <div class="bg-white w-full sm:w-[390px] max-h-[88%] rounded-t-3xl sm:rounded-3xl p-5 space-y-4 overflow-y-auto animate-slide-up shadow-2xl">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xl">✨</span>
              <h3 class="text-base font-black text-slate-900">AI 整體旅程洞察</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
          </div>

          <div class="bg-slate-50 rounded-2xl p-3.5 grid grid-cols-3 gap-2 text-center">
            <div>
              <p class="text-base font-black text-slate-900">${stayCount}</p>
              <p class="text-[10px] font-bold text-slate-500">🏨 住宿選擇</p>
            </div>
            <div>
              <p class="text-base font-black text-slate-900">${foodCount}</p>
              <p class="text-[10px] font-bold text-slate-500">🍣 餐廳靈感</p>
            </div>
            <div>
              <p class="text-base font-black text-slate-900">${actCount}</p>
              <p class="text-[10px] font-bold text-slate-500">🎡 景點活動</p>
            </div>
          </div>

          <div class="space-y-2.5">
            <h4 class="text-xs font-extrabold text-amber-700">⚠️ AI 幫你發現行程盲點</h4>
            <div class="bg-amber-50/80 border border-amber-200/80 rounded-2xl p-3 text-xs text-amber-950 space-y-2">
              <p>📍 <strong>區域集中度高：</strong>大部分活動集中喺「新宿」及「澀谷」，住新宿非常順路。</p>
              <p>🍣 <strong>餐飲重複提醒：</strong>收藏咗多間排隊名店，建議每日最多安排 1 間需排隊餐廳。</p>
              <p>🎫 <strong>搶飛倒數：</strong>TeamLab Borderless 同 Shibuya Sky 需提前 3–4 星期網上預訂。</p>
            </div>
          </div>

          <div class="space-y-2">
            <h4 class="text-xs font-extrabold text-slate-900">🏆 團隊共識最高 Top 3</h4>
            <div class="space-y-1.5">
              ${[...state.ideas].sort((a, b) => b.teamScore - a.teamScore).slice(0, 3).map((item, idx) => `
                <div class="bg-slate-50 rounded-xl px-3 py-2 flex items-center justify-between text-xs font-bold">
                  <span>${idx + 1}. ${item.icon} ${item.shortTitle}</span>
                  <span class="text-amber-600">⭐ ${item.teamScore.toFixed(1)}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <button onclick="closeModal(); state.ideasViewMode='compare'; switchTab('ideas');" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-extrabold hover:bg-indigo-700 transition">
            ⚖️ 立即並排比較住宿選項
          </button>
        </div>
      `);
    }

    // =========================================================================
    // 13. MAIN RENDER CONTROLLER & INITIALIZATION
    // =========================================================================
    function updateBottomNavActiveState() {
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => {
        const tab = btn.dataset.tab;
        if (tab === 'add') return;
        if (state.currentScreen === 'main' && state.activeTab === tab) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-[#FF5A5F]', 'bg-rose-50/60');
        } else {
          btn.classList.remove('text-[#FF5A5F]', 'bg-rose-50/60');
          btn.classList.add('text-slate-400');
        }
      });
    }

    function render() {
      const container = document.getElementById('main-content');
      if (!container) return;

      updateBottomNavActiveState();

      if (state.currentScreen === 'trips') {
        container.innerHTML = renderScreen1Trips();
        return;
      }

      switch (state.activeTab) {
        case 'home':
          container.innerHTML = renderScreen2Home();
          break;
        case 'ideas':
          container.innerHTML = renderScreen5And6Ideas();
          if (state.ideasViewMode === 'map') {
            setTimeout(initLeafletMap, 60);
          }
          break;
        case 'add':
          container.innerHTML = renderScreen3And4AddIdea();
          break;
        case 'itinerary':
          container.innerHTML = renderScreen10Itinerary();
          setTimeout(initSortable, 30);
          break;
        case 'group':
          container.innerHTML = renderScreenGroupAndDecisions();
          break;
        default:
          container.innerHTML = renderScreen2Home();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
